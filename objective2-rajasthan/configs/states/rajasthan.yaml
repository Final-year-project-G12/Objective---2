# ============================================================================
# states/rajasthan.yaml  —  Phase 1 output (per-state, version-locked)
# ============================================================================
# References (does NOT copy) the shared configs and Objective 1 frozen
# inputs already sitting under data/objective1/, data/weather/, data/demand/.
# Generated by hand from the frozen Objective 1 outputs
# (data/objective1/cluster_profiles_rajasthan.csv, mcdm_topk_by_cluster.csv,
# climate_signature_rajasthan.csv, medoid_points_rajasthan.csv, manifest.json)
# — see docs_objective2/01_PHASE1_CONFIG_AND_STATE_SETUP.md (Tamil Nadu
# reference) for exactly how each field below was read off those files.
#
# Do not edit this file after Phase 4 (verification) begins. A later change
# to any field here means the state must re-run from Phase 2 onward
# (O2_Unified_PerState_Execution_Framework.md, Phase 0 gate).
# ============================================================================

state: rajasthan
state_config_version: "state_config_rajasthan_v1.0"
objective1_manifest: data/objective1/manifest.json

shared_config:
  system_config: configs/system_config_shared.yaml
  design_bounds: configs/design_bounds_shared.yaml
pareto_tolerance_pct: 5.0   # inherited from system_config_shared.yaml — do not override (Bug-Fix 7)

demand_profile:
  file: data/demand/demand_profile_rajasthan.csv
  daily_total_L: 300.0
  documented_reason: >
    Matches 04_climate_signature_rajasthan.py's DRAW_VOLUME_L=300 assumption
    (Avargani et al. 2021) so Objective 1's L_required figures and
    Objective 2's simulated solar fraction evaluate the same household.
    Identical daily total to Tamil Nadu (state-invariant demand) so the
    four-state comparison stays fair. See build_demand_profile.py docstring.

mains_temperature_C:
  range_low: 18.0
  range_high: 30.0
  source: "O2_Unified_PerState_Execution_Framework.md, state input table (Rajasthan row: 'RJ 18-30 C')"
  # Per-regime point estimate used by the simulator is T_mains_est_C below
  # (population-weighted cluster mean of the point-level T_mains_est_C column
  # in climate_signature_rajasthan.csv, already inside this range).

climate_signature_sanity_check:
  # Bug-Fix 8 — confirms this is genuinely Rajasthan weather, not another state's.
  annual_GHI_daily_kWh_expected_band: [4.8, 6.5]     # RJ hot-dry / high-clearness, framework doc §2 (~6.0 rule-of-thumb)
  humidity_signature_expected: "hot-dry: very high CDD24, large DTR, high daytime clearness, low cloud fraction (sunrise RH stays high from nocturnal cooling even in arid climate)"
  elevation_note: "Rajasthan Objective 1 has a dedicated elevation attach (00c_attach_elevation.py); elevation carried through unchanged into Objective 2 — not an Obj2 change."
  status: PASSED
  evidence: >
    cluster_profiles_rajasthan.csv: GHI_daily_kWh in [5.00, 5.35] kWh/m2/day
    across the 3 Level-A regimes — inside the expected band and above humid
    Assam (~4.2) and coastal Tamil Nadu (~4.8); it sits just below the
    framework's ~6.0 rule-of-thumb because these are all-month
    population-weighted means over erratic-but-arid clusters. Hot-dry
    signature confirmed independently of sunrise RH: CDD24 = 12,348-15,837,
    DTR_true = 13.5-13.8 C, Ta_p95 = 35.6-36.4 C, cloudy_frac = 0.005-0.016,
    kt_daily_mean = 0.87-0.90 — not Tamil Nadu's coastal-humid, low-clearness
    signature and not Assam's humid-cloudy one. No duplicate timestamps or
    calendar gaps in any of the 3 daily weather files (3653 days each,
    2016-01-01..2025-12-31).

# One entry per Level-A GMM regime discovered by Objective 1 (K_FINAL=3 for
# Rajasthan; Tamil Nadu had K_FINAL=5). Do not re-cluster. Values below are
# population-weighted cluster means from
# data/objective1/cluster_profiles_rajasthan.csv (and, for T_mains_est_C,
# the population-weighted mean of climate_signature_rajasthan.csv).
regimes:
  - cluster_id: 0
    label: "cooler arid / low-monsoon, erratic solar, medoid RJP_0132 (114 pts)"
    n_points: 114
    population_covered: 22568150
    Tm_target_C: 57.0
    T_mains_est_C: 25.092
    L_required_kJ_per_kg: 312.79
    weather_hourly: data/weather/weather_regime_rajasthan_cluster0_hourly.csv
    weather_daily: data/weather/weather_regime_rajasthan_cluster0_daily.csv
    pcm_shortlist: ["RT50", "RT45HC", "Lauric acid (C12)"]

  - cluster_id: 1
    label: "hot, monsoon-influenced, steady solar, high autonomy demand, medoid RJP_0202 (103 pts)"
    n_points: 103
    population_covered: 17959813
    Tm_target_C: 57.0
    T_mains_est_C: 25.783
    L_required_kJ_per_kg: 304.11
    weather_hourly: data/weather/weather_regime_rajasthan_cluster1_hourly.csv
    weather_daily: data/weather/weather_regime_rajasthan_cluster1_daily.csv
    pcm_shortlist: ["savE® OM50", "Paraffin/HDPE PCM3", "Paraffin/HDPE PCM6"]

  - cluster_id: 2
    label: "cooler arid / low-monsoon, erratic solar, largest population, medoid RJP_0055 (103 pts)"
    n_points: 103
    population_covered: 29775240
    Tm_target_C: 57.0
    T_mains_est_C: 24.524
    L_required_kJ_per_kg: 319.92
    weather_hourly: data/weather/weather_regime_rajasthan_cluster2_hourly.csv
    weather_daily: data/weather/weather_regime_rajasthan_cluster2_daily.csv
    pcm_shortlist: ["savE® OM50", "Paraffin/HDPE PCM3", "Paraffin/HDPE PCM6"]

pcm_database_file: data/objective1/pcm_database_rajasthan.csv
pcm_mcdm_topk_file: data/objective1/mcdm_topk_by_cluster.csv
