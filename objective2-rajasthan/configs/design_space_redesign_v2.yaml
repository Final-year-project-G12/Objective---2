# Objective 2 redesign - APPROVED design space (Rajasthan folder only).
# Approved by the user on 2026-10-26 after the G7 sensitivity study (docs/REDESIGN_PROGRESS.md section 9).
# This is a NEW file; configs/design_bounds_shared.yaml (legacy 8-37 capsules / 40-80 mm diameter) is untouched
# and still describes the pre-redesign pipeline. system_config_shared.yaml is frozen and unchanged.
version: design_space_o2_v2_2026-10-26

variables:
  inner_radius_m:      {min: 0.010, max: 0.040}   # PCM thickness = sphere inner radius (decision D3); outer D = 2*(R_in + wall)
  pcm_volume_fraction: {min: 0.02,  max: 0.20}    # capsule OUTER volume / tank volume; count N is derived (below)
  flow_rate_kg_s:      {min: 0.010, max: 0.050}   # kept as in the legacy bounds (decision: option b, see flow_note)
  arrangement:         [single-layer, staggered, radial]

count_rule: "N = clip(round(f * V_tank / V_capsule_outer(R)), ceil(0.02*V_tank/V), floor(0.20*V_tank/V))"

constraints:
  pcm_peak_limit_C: 65.0       # a design whose PCM peak exceeds this in ANY simulated year is INFEASIBLE (user decision)
  water_peak_limit_C: 75.0
  geometry: "exact: src/design/geometry.py (packing, passage fraction >= 0.05, spacing >= 3 mm)"

model:
  tank_model: multinode
  n_nodes: 10                  # user decision; N-sensitivity (10 -> 20: 0.15-0.25 pp on the gain) goes into the WP6 band
  stack_anchor: center         # ablated in G11
  timestep_s: 150              # code-level production override in src/simulation/run_case.py

baseline: "water-only tank at the SAME flow, weather year, demand, shield and tank model (user decision)"

flow_note: >
  The project collector model has a flow-independent F_R, so lower flow always helps the multi-node water tank.
  Any optimum found at the 0.010 kg/s floor is to be reported as a MODEL ARTEFACT, not a physical optimum
  (user decision, option b).

fixed_not_optimised: [tank_volume_L, collector_area_m2, demand_profile, O1_pcm_shortlist]
