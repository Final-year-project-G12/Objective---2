# ============================================================================
# states/uttarakhand.yaml  -  per-state inputs (weather, regimes, PCM shortlist, mains temperature, demand)
# ============================================================================
# REGENERATED 2026-10-28 for Objective 1's switch from K=5 to K=4 climate
# regimes (PCM-Selection-ML-model commit 6be0dcd, "Switch Uttarakhand clustering
# from K=5 to K=4 and regenerate outputs"). The cluster ids were reshuffled by
# that change: the 10-point warm regime that was cluster 3 under K=5 is now
# cluster 0, the 3-point cold regime that was cluster 1 is now cluster 3, and the
# K=5 clusters 0 and 4 merged into the new 23-point cluster 1. Nothing from the
# K=5 version of this file (or any result keyed by its cluster ids) applies to
# this one.
#
# Every regime value is read from data/objective1/cluster_profiles_uttarakhand.csv
# (Tm_target_C = O1's Tm_target_C_regime_capped, T_mains_est_C = O1's own column,
# Ta_mean - 2.0) and data/objective1/mcdm_topk_by_cluster.csv (pcm_shortlist =
# O1's MCDM top-3 in consensus-rank order, which is what src/io_utils.get_regime()
# returns as the shortlist; tests/test_o1_shortlist.py checks that the two agree). Medoids are O1's own
# (09_recommendation_cards.py), each with membership probability 1.0, and are
# the single list in src/weather/inventory.py: CURRENT_MEDOIDS.
#
# Do not edit this file after verification (G6) begins; a change here means the
# state must re-run the chain from G6 onward.
# ============================================================================

state: uttarakhand
state_config_version: state_config_uttarakhand_v3_2026-10-28-o1-k4
objective1_manifest: data/objective1/manifest.json
shared_config:
  system_config: configs/system_config_shared.yaml
  design_space: configs/design_space.yaml
pareto_tolerance_pct: 5.0
demand_profile:
  file: data/demand/demand_profile_uttarakhand.csv
  daily_total_L: 300.0
  documented_reason: 'Matches 04b_climate_signature.py''s DRAW_VOLUME_L=300 assumption (Avargani et al.
    2021) so Objective 1''s L_required figures and Objective 2''s simulated solar fraction evaluate the
    same household. See build_demand_profile.py docstring.

    '
mains_temperature_C:
  range_low: 7.45
  range_high: 21.82
  source: Copied directly from cluster_profiles_uttarakhand.csv's T_mains_est_C column (Ta_mean - 2.0,
    computed by 04b_climate_signature.py), K=4 regimes.
climate_signature_sanity_check:
  annual_GHI_daily_kWh_expected_band:
  - 4.5
  - 5.0
  humidity_signature_expected: 'Himalayan foothill-to-high-altitude: moderate RH (55-62 %), DTR 10.6-11.5 C,
    heating-dominated except the warm low-elevation regime 0 (CDD24 10,288 vs HDD18 3,220).'
  elevation_note: Uttarakhand has NO dedicated elevation-attachment script either — three inconsistent
    hardcoded/derived elevation values coexist (0m in 00b_build_suntimes.py, 1200m flat DEFAULT_ALT_M
    in 02_combine, and a pressure-derived elev_proxy in 04b, itself compressed by the era5_P_atm>=850hPa
    bound clipping ~37% of high-elevation readings). Documented Obj1 limitation, not an Obj2 change —
    carried over from this project's own audit findings.
  status: PASSED (values read from cluster_profiles_uttarakhand.csv, K=4)
  evidence: 'cluster_profiles_uttarakhand.csv (K=4, 2026-10-03): GHI_daily_kWh in [4.57, 4.90] kWh/m2/day
    across the 4 regimes, inside the expected band; RH_mean 54.8 / 57.6 / 58.9 / 62.4 %; HDD18 3,220 /
    6,790 / 8,726 / 32,508; elevation 323 / 1,090 / 1,299 / 2,219 m (regimes 0-3).

    '
