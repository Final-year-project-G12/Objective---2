# ============================================================================
# states/uttarakhand.yaml  —  Phase 1 output (per-state, version-locked)
# ============================================================================
# References (does NOT copy) the shared configs and Objective 1 frozen
# inputs that must sit under data/objective1/, data/weather/, data/demand/
# once you've run build_input_package.py, build_regime_weather.py and
# build_demand_profile.py locally (see NEEDS_LOCAL_DATA.md in this folder).
#
# Values below are taken from the actual Uttarakhand Objective 1 console
# output produced during this project's chat session (04b_climate_signature.py,
# 05_cluster_uttarakhand.py, 07_feasibility_filter.py and 08_mcdm_ranking.py
# runs, post-fix: ASSUMED_PCM_MASS_KG=150, covariance_type="diag").
# T_mains_est_C is DERIVED here (Ta_mean - 2.0, matching 04b's own formula)
# since the console output printed Ta_mean but not T_mains_est_C directly —
# marked below so you can cross-check it against your own
# cluster_profiles_uttarakhand.csv once you copy it in.
#
# Do not edit this file after Phase 4 (verification) begins. A later change
# to any field here means the state must re-run from Phase 2 onward
# (O2_Unified_PerState_Execution_Framework.md, Phase 0 gate).
# ============================================================================

state: uttarakhand
state_config_version: "state_config_uttarakhand_v1.0"
objective1_manifest: data/objective1/manifest.json

shared_config:
  system_config: configs/system_config_shared.yaml
  design_bounds: configs/design_bounds_shared.yaml
pareto_tolerance_pct: 5.0   # inherited from system_config_shared.yaml — do not override

demand_profile:
  file: data/demand/demand_profile_uttarakhand.csv
  daily_total_L: 300.0
  documented_reason: >
    Matches 04b_climate_signature.py's DRAW_VOLUME_L=300 assumption
    (Avargani et al. 2021) so Objective 1's L_required figures and
    Objective 2's simulated solar fraction evaluate the same household.
    See build_demand_profile.py docstring.

mains_temperature_C:
  range_low: 7.4    # Cluster 2 (coldest regime): Ta_mean 9.4C - 2.0
  range_high: 21.8  # Cluster 3 (warmest regime): Ta_mean 23.8C - 2.0
  source: "Derived (Ta_mean - 2.0) from this project's 05_cluster_uttarakhand.py console output — NOT independently sourced from a mains-temperature study. Cross-check against cluster_profiles_uttarakhand.csv's own T_mains_est_C column once copied in."

climate_signature_sanity_check:
  # Confirms this is genuinely Uttarakhand weather, not another state's.
  annual_GHI_daily_kWh_expected_band: [4.5, 5.0]   # observed 4.57-4.93 across the 5 clusters in this project's actual run
  humidity_signature_expected: "NOT AVAILABLE from console output captured in this project's session — RH_mean per cluster was never printed. Check climate_signature_uttarakhand.csv / cluster_profiles_uttarakhand.csv directly once copied in, and fill this in by hand (matching Tamil Nadu's own documented approach)."
  elevation_note: "Uttarakhand has NO dedicated elevation-attachment script either — three inconsistent hardcoded/derived elevation values coexist (0m in 00b_build_suntimes.py, 1200m flat DEFAULT_ALT_M in 02_combine, and a pressure-derived elev_proxy in 04b, itself compressed by the era5_P_atm>=850hPa bound clipping ~37% of high-elevation readings). Documented Obj1 limitation, not an Obj2 change — carried over from this project's own audit findings."
  status: "NOT INDEPENDENTLY VERIFIED — fill in humidity_signature_expected and re-check GHI band once you have the real climate_signature_uttarakhand.csv locally."
  evidence: >
    cluster_profiles_uttarakhand.csv (per this project's actual 05_cluster_uttarakhand.py
    run): GHI_daily_kWh in [4.57, 4.93] kWh/m2/day across the 5 clusters.
    RH_mean not captured in the console output available at config-write time.

# One entry per Level-A GMM regime discovered by Objective 1 (K_FINAL=5).
# Do not re-cluster. Values below are taken directly from this project's
# actual 05_cluster_uttarakhand.py / 07_feasibility_filter.py / 08_mcdm_ranking.py
# console output (post-fix: ASSUMED_PCM_MASS_KG=150, covariance_type="diag").
regimes:
  - cluster_id: 0
    label: "regime 0 (15 pts, Ta_mean~21.4C, GHI~4.80 kWh/m2/day)"
    n_points: 15
    population_covered: 2729553
    Tm_target_C: 57.0
    T_mains_est_C: 19.4   # DERIVED: Ta_mean(21.4) - 2.0 — cross-check locally
    L_required_kJ_per_kg: 128
    weather_hourly: data/weather/weather_regime_uttarakhand_cluster0_hourly.csv
    weather_daily: data/weather/weather_regime_uttarakhand_cluster0_daily.csv
    pcm_shortlist: ["PureTemp 58", "n-Octacosane (C28)", "PlusICE A58"]

  - cluster_id: 1
    label: "regime 1 (9 pts, Ta_mean~19.0C, GHI~4.90 kWh/m2/day)"
    n_points: 9
    population_covered: 2451044
    Tm_target_C: 57.0
    T_mains_est_C: 17.0   # DERIVED: Ta_mean(19.0) - 2.0 — cross-check locally
    L_required_kJ_per_kg: 138
    weather_hourly: data/weather/weather_regime_uttarakhand_cluster1_hourly.csv
    weather_daily: data/weather/weather_regime_uttarakhand_cluster1_daily.csv
    pcm_shortlist: ["PureTemp 58", "Palmitic-stearic acid/Expanded graphite", "n-Octacosane (C28)"]

  - cluster_id: 2
    label: "regime 2 (3 pts — SMALL SAMPLE, Ta_mean~9.4C, GHI~4.57 kWh/m2/day)"
    n_points: 3
    population_covered: 330780
    Tm_target_C: 57.0
    T_mains_est_C: 7.4    # DERIVED: Ta_mean(9.4) - 2.0 — cross-check locally
    L_required_kJ_per_kg: 178
    weather_hourly: data/weather/weather_regime_uttarakhand_cluster2_hourly.csv
    weather_daily: data/weather/weather_regime_uttarakhand_cluster2_daily.csv
    pcm_shortlist: ["PureTemp 58", "n-Octacosane (C28)", "PlusICE A58"]
    caveat: "Only 3 sampling points — every statistic for this regime rests on a small sample (documented Obj1 limitation)."

  - cluster_id: 3
    label: "regime 3 (10 pts, Ta_mean~23.8C, GHI~4.75 kWh/m2/day)"
    n_points: 10
    population_covered: 3700876
    Tm_target_C: 57.0
    T_mains_est_C: 21.8   # DERIVED: Ta_mean(23.8) - 2.0 — cross-check locally
    L_required_kJ_per_kg: 118
    weather_hourly: data/weather/weather_regime_uttarakhand_cluster3_hourly.csv
    weather_daily: data/weather/weather_regime_uttarakhand_cluster3_daily.csv
    pcm_shortlist: ["PureTemp 58", "Palmitic-stearic acid/Expanded graphite", "n-Octacosane (C28)"]

  - cluster_id: 4
    label: "regime 4 (8 pts, Ta_mean~18.8C, GHI~4.93 kWh/m2/day)"
    n_points: 8
    population_covered: 1263461
    Tm_target_C: 57.0
    T_mains_est_C: 16.8   # DERIVED: Ta_mean(18.8) - 2.0 — cross-check locally
    L_required_kJ_per_kg: 139
    weather_hourly: data/weather/weather_regime_uttarakhand_cluster4_hourly.csv
    weather_daily: data/weather/weather_regime_uttarakhand_cluster4_daily.csv
    pcm_shortlist: ["PureTemp 58", "n-Octacosane (C28)", "PlusICE A58"]

pcm_database_file: data/objective1/pcm_database_uttarakhand.csv
pcm_mcdm_topk_file: data/objective1/mcdm_topk_by_cluster.csv
