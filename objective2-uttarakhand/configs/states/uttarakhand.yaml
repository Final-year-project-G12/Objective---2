# ============================================================================
# states/uttarakhand.yaml  —  Phase 1 output (per-state, version-locked)
# ============================================================================
# References (does NOT copy) the shared configs and Objective 1 frozen
# inputs that must sit under data/objective1/, data/weather/, data/demand/
# once you've run build_input_package.py, build_regime_weather.py and
# build_demand_profile.py locally (see NEEDS_LOCAL_DATA.md in this folder).
#
# Values below are read directly from data/objective1/cluster_profiles_uttarakhand.csv
# and data/objective1/mcdm_topk_by_cluster.csv (post the 2026-09-13 Objective 1
# bug-fix pass: MCDM ranking/feasibility/physics-validation fixes, corrected
# run_all_uttarakhand.py phase skip). REGENERATED on 2026-09-13 after that fix
# changed the GMM's cluster assignments enough to shift which cluster_id maps
# to which climate (previous cluster_id 1 and 2 were swapped versus this
# version, and cluster 0/4's point counts also shifted) — the prior version of
# this file was silently stale against the rebuilt data/weather/ files, which
# always follow the *current* clustering. T_mains_est_C here is copied directly
# from cluster_profiles_uttarakhand.csv's own T_mains_est_C column (Ta_mean - 2.0,
# already computed by 04b_climate_signature.py), not re-derived by hand.
#
# Do not edit this file after Phase 4 (verification) begins. A later change
# to any field here means the state must re-run from Phase 2 onward
# (O2_Unified_PerState_Execution_Framework.md, Phase 0 gate).
# ============================================================================


# ----------------------------------------------------------------------------
# TM_TARGET_C RETARGETED (deliberate Objective 2 methodology revision, not a
# silent edit) -- see docs_objective2/12_TM_TARGET_RETARGETING.md and
# results/uttarakhand/tm_retargeting_report.csv for the full before/after
# evidence. Tm_target_C and pcm_shortlist below now reflect this tank's own
# simulated charging-hour water-temperature median per regime, not Objective
# 1's climate/delivery-anchored formula. Re-run Phases 3-8 after this change
# (framework doc Phase 0 gate).
# ----------------------------------------------------------------------------

state: uttarakhand
state_config_version: state_config_uttarakhand_v1.0
objective1_manifest: data/objective1/manifest.json
shared_config:
  system_config: configs/system_config_shared.yaml
  design_bounds: configs/design_bounds_shared.yaml
pareto_tolerance_pct: 5.0
demand_profile:
  file: data/demand/demand_profile_uttarakhand.csv
  daily_total_L: 300.0
  documented_reason: 'Matches 04b_climate_signature.py''s DRAW_VOLUME_L=300 assumption (Avargani et al.
    2021) so Objective 1''s L_required figures and Objective 2''s simulated solar fraction evaluate the
    same household. See build_demand_profile.py docstring.

    '
mains_temperature_C:
  range_low: 7.45
  range_high: 21.82
  source: Copied directly from cluster_profiles_uttarakhand.csv's T_mains_est_C column (Ta_mean - 2.0,
    computed by 04b_climate_signature.py).
climate_signature_sanity_check:
  annual_GHI_daily_kWh_expected_band:
  - 4.5
  - 5.0
  humidity_signature_expected: NOT AVAILABLE from console output captured in this project's session —
    RH_mean per cluster was never printed. Check climate_signature_uttarakhand.csv / cluster_profiles_uttarakhand.csv
    directly once copied in, and fill this in by hand (matching Tamil Nadu's own documented approach).
  elevation_note: Uttarakhand has NO dedicated elevation-attachment script either — three inconsistent
    hardcoded/derived elevation values coexist (0m in 00b_build_suntimes.py, 1200m flat DEFAULT_ALT_M
    in 02_combine, and a pressure-derived elev_proxy in 04b, itself compressed by the era5_P_atm>=850hPa
    bound clipping ~37% of high-elevation readings). Documented Obj1 limitation, not an Obj2 change —
    carried over from this project's own audit findings.
  status: NOT INDEPENDENTLY VERIFIED — fill in humidity_signature_expected by hand.
  evidence: 'cluster_profiles_uttarakhand.csv (post the 2026-09-13 Objective 1 fix pass): GHI_daily_kWh
    in [4.57, 4.90] kWh/m2/day across the 5 clusters. RH_mean not captured in the console output available
    at config-write time.

    '
regimes:
