# ============================================================================
# states/rajasthan.yaml  -  per-state inputs (weather, regimes, PCM shortlist, mains temperature, demand)
# ============================================================================
# References the shared configs and the Objective 1 inputs under data/objective1/, data/weather/, data/demand/
# (cluster_profiles_rajasthan.csv, mcdm_topk_by_cluster.csv, climate_signature_rajasthan.csv, manifest.json).
# `pcm_shortlist` is Objective 1's MCDM top-3 per cluster in consensus-rank order; src/io_utils.get_regime() reads the
# same list from data/objective1/mcdm_topk_by_cluster.csv and tests/test_o1_shortlist.py checks that the two agree.
# ============================================================================

state: rajasthan
state_config_version: state_config_rajasthan_v3_2026-10-28
objective1_manifest: data/objective1/manifest.json
shared_config:
  system_config: configs/system_config_shared.yaml
  design_space: configs/design_space.yaml
pareto_tolerance_pct: 5.0
demand_profile:
  file: data/demand/demand_profile_rajasthan.csv
  daily_total_L: 300.0
  documented_reason: 'Matches 04_climate_signature_rajasthan.py''s DRAW_VOLUME_L=300 assumption (Avargani
    et al. 2021) so Objective 1''s L_required figures and Objective 2''s simulated solar fraction evaluate
    the same household. Identical daily total to Tamil Nadu (state-invariant demand) so the four-state
    comparison stays fair. See build_demand_profile.py docstring.

    '
mains_temperature_C:
  range_low: 18.0
  range_high: 30.0
  source: 'O2_Unified_PerState_Execution_Framework.md, state input table (Rajasthan row: ''RJ 18-30 C'')'
climate_signature_sanity_check:
  annual_GHI_daily_kWh_expected_band:
  - 4.8
  - 6.5
  humidity_signature_expected: 'hot-dry: very high CDD24, large DTR, high daytime clearness, low cloud
    fraction (sunrise RH stays high from nocturnal cooling even in arid climate)'
  elevation_note: Rajasthan Objective 1 has a dedicated elevation attach (00c_attach_elevation.py); elevation
    carried through unchanged into Objective 2 — not an Obj2 change.
  status: PASSED
  evidence: 'cluster_profiles_rajasthan.csv: GHI_daily_kWh in [5.00, 5.35] kWh/m2/day across the 3 Level-A
    regimes — inside the expected band and above humid Assam (~4.2) and coastal Tamil Nadu (~4.8); it
    sits just below the framework''s ~6.0 rule-of-thumb because these are all-month population-weighted
    means over erratic-but-arid clusters. Hot-dry signature confirmed independently of sunrise RH: CDD24
    = 12,348-15,837, DTR_true = 13.5-13.8 C, Ta_p95 = 35.6-36.4 C, cloudy_frac = 0.005-0.016, kt_daily_mean
    = 0.87-0.90 — not Tamil Nadu''s coastal-humid, low-clearness signature and not Assam''s humid-cloudy
    one. No duplicate timestamps or calendar gaps in any of the 3 daily weather files (3653 days each,
    2016-01-01..2025-12-31).

    '
