# ============================================================================
# states/tamilnadu.yaml  —  Phase 1 output (per-state, version-locked)
# ============================================================================
# References (does NOT copy) the shared configs and Objective 1 frozen
# inputs already sitting under data/objective1/, data/weather/, data/demand/.
# Generated by hand from the frozen Objective 1 outputs
# (data/objective1/cluster_profiles_tamilnadu.csv, mcdm_topk_by_cluster.csv,
# manifest.json) — see docs_objective2/01_PHASE1_CONFIG_AND_STATE_SETUP.md
# for exactly how each field below was read off those files.
#
# Do not edit this file after Phase 4 (verification) begins. A later change
# to any field here means the state must re-run from Phase 2 onward
# (O2_Unified_PerState_Execution_Framework.md, Phase 0 gate).
# ============================================================================


# ----------------------------------------------------------------------------
# TM_TARGET_C RETARGETED (deliberate Objective 2 methodology revision, not a
# silent edit) -- see docs_objective2/12_TM_TARGET_RETARGETING.md and
# results/tamilnadu/tm_retargeting_report.csv for the full before/after
# evidence. Tm_target_C and pcm_shortlist below now reflect this tank's own
# simulated charging-hour water-temperature median per regime, not Objective
# 1's climate/delivery-anchored formula. Re-run Phases 3-8 after this change
# (framework doc Phase 0 gate).
# ----------------------------------------------------------------------------

state: tamilnadu
state_config_version: state_config_tamilnadu_v1.0
objective1_manifest: data/objective1/manifest.json
shared_config:
  system_config: configs/system_config_shared.yaml
  design_bounds: configs/design_bounds_shared.yaml
pareto_tolerance_pct: 5.0
demand_profile:
  file: data/demand/demand_profile_tamilnadu.csv
  daily_total_L: 300.0
  documented_reason: 'Matches 04b_climate_signature.py''s DRAW_VOLUME_L=300 assumption (Avargani et al.
    2021) so Objective 1''s L_required figures and Objective 2''s simulated solar fraction evaluate the
    same household. See build_demand_profile.py docstring.

    '
mains_temperature_C:
  range_low: 22.0
  range_high: 30.0
  source: O2_Unified_PerState_Execution_Framework.md, state input table (Tamil Nadu row)
climate_signature_sanity_check:
  annual_GHI_daily_kWh_expected_band:
  - 4.0
  - 5.6
  humidity_signature_expected: RH_mean > 60% in most clusters (coastal/humid)
  elevation_note: Tamil Nadu uses flat 150 m elevation approximation (no dedicated elevation script) —
    documented Obj1 limitation, not an Obj2 change.
  status: PASSED
  evidence: 'cluster_profiles_tamilnadu.csv: GHI_daily_kWh in [5.13, 5.28] kWh/m2/day (inside expected
    band); RH_mean in [62.5, 70.2]% across the 5 clusters — consistent with Tamil Nadu''s coastal-humid
    signature, not e.g. Rajasthan''s hot-dry low-humidity signature.

    '
