# ============================================================================
# states/tamilnadu.yaml  —  Phase 1 output (per-state, version-locked)
# ============================================================================
# References (does NOT copy) the shared configs and Objective 1 frozen
# inputs already sitting under data/objective1/, data/weather/, data/demand/.
# Generated from the FRESH Objective 1 outputs (2026-09-17 tamilnadu_pipeline
# re-run — see docs_objective2/16_OBJECTIVE1_DATA_REFRESH.md for the full
# before/after diff): data/objective1/cluster_profiles_tamilnadu.csv,
# cluster_assignments_tamilnadu.csv, signatures/climate_signature_tamilnadu.csv
# (per-point T_mains_est_C / elevation_m), mcdm_topk_by_cluster.csv, manifest.json.
#
# THIS REFRESH CHANGED THE REGIME COUNT: Objective 1's GMM model selection
# now chooses K=3 (was K=5 in the pre-2026-09-17 run). Do not assume 5
# regimes anywhere downstream — every regime-indexed file/table in this
# project (results/, docs_objective2/ plots, recommendation cards) must be
# regenerated against these 3 regimes, not patched from the old 5.
#
# Do not edit this file after Phase 4 (verification) begins. A later change
# to any field here means the state must re-run from Phase 2 onward
# (O2_Unified_PerState_Execution_Framework.md, Phase 0 gate).
# ============================================================================

# ----------------------------------------------------------------------------
# Tm_target_C / pcm_shortlist RESTORED to Objective 1's actual output,
# 2026-09-18 (see docs_objective2/18_OBJECTIVE1_SHORTLIST_RESTORED.md).
# SUPERSEDES the 2026-09-17 "Tm-retargeting" revision (doc 12,
# .bak_pre_obj1_shortlist_restore holds that version): retargeting had
# Objective 2 silently re-deriving its own Tm_target from tank simulation
# and re-ranking PCMs from scratch, so the actually-deployed PCM in every
# regime was NOT one of Objective 1's Top-3 candidates. Per the project's
# own objective statements -- Objective 1 "identifies the Top-2/Top-3
# suitable PCM candidates"; Objective 2 "determine[s] the optimal PCM
# thickness, capsule arrangement, number of PCM capsules, and flow rate"
# for those candidates, not a different material -- Objective 2 must
# search geometry/flow for Objective 1's ACTUAL shortlisted PCMs and
# select among THEM by simulated performance, never substitute a PCM
# Objective 1 did not shortlist. Tm_target_C and pcm_shortlist below are
# copied verbatim from data/objective1/cluster_profiles_tamilnadu.csv and
# mcdm_topk_by_cluster.csv (consensus_rank order; cluster 2 has a genuine
# tie at rank 2, both tied candidates kept). Re-run Phases 5-8 after this
# change (framework doc Phase 0 gate) -- Phases 2-4 are PCM-identity-
# agnostic (geometry/simulator-physics only) and do not need re-running.
# ----------------------------------------------------------------------------

state: tamilnadu
state_config_version: state_config_tamilnadu_v3.0_2026-09-18
objective1_manifest: data/objective1/manifest.json
shared_config:
  system_config: configs/system_config_shared.yaml
  design_bounds: configs/design_bounds_shared.yaml
pareto_tolerance_pct: 5.0
demand_profile:
  file: data/demand/demand_profile_tamilnadu.csv
  daily_total_L: 300.0
  documented_reason: >
    Matches 04b_climate_signature.py's DRAW_VOLUME_L=300 assumption
    (Avargani et al. 2021) so Objective 1's L_required figures and
    Objective 2's simulated solar fraction evaluate the same household.
    Unaffected by the 2026-09-17 Objective 1 refresh (Objective 2's own
    demand assumption, not derived from Objective 1). See
    build_demand_profile.py docstring.
mains_temperature_C:
  range_low: 23.97
  range_high: 28.46
  source: >
    Per-medoid T_mains_est_C from the 2026-09-17 refreshed
    data/objective1/signatures/climate_signature_tamilnadu.csv (was a
    hand-set 22-30C state-level band before this refresh; now the actual
    range spanned by this state's 3 regime medoids).
climate_signature_sanity_check:
  annual_GHI_daily_kWh_expected_band: [4.0, 5.6]
  humidity_signature_expected: "RH_mean > 60% in most clusters (coastal/humid)"
  elevation_note: >
    RESOLVED as of the 2026-09-17 refresh: tamilnadu_pipeline now runs
    00c_attach_elevation.py (previously Tamil Nadu had no dedicated
    elevation script and used a flat 150 m approximation). Real elevation
    now varies 44-627 m across the 3 regime medoids -- cluster 1's medoid
    (TNP_0007, 626.9 m) is a genuine highland/Nilgiris-adjacent point, not
    a flat-terrain approximation.
  status: PASSED
  evidence: >
    cluster_profiles_tamilnadu.csv (fresh run): GHI_daily_kWh in
    [5.15, 5.32] kWh/m2/day (inside expected band); mean Ta in
    [27.1, 29.7] C — consistent with Tamil Nadu's coastal/interior tropical
    signature, not e.g. Rajasthan's hot-dry or Uttarakhand's
    elevation-dominated signature.

# 3 Level-A GMM regimes (K=3, chosen by the 2026-09-17 refreshed
# 05_cluster_tamilnadu.py model-selection run). Do not re-cluster.
# Tm_target_C and pcm_shortlist are Objective 1's own output, unedited.
regimes:
  - cluster_id: 0
    label: "coastal/interior lowland (46 pts, medoid elev 156 m)"
    n_points: 46
    population_covered: 20468850
    Tm_target_C: 67.0
    T_mains_est_C: 28.463
    L_required_kJ_per_kg: 405.97
    medoid_point_id: TNP_0006
    medoid_elevation_m: 155.66
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster0_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster0_daily.csv
    pcm_shortlist: ["RT57HC", "n-Hexacosane (C26)", "PureTemp 58"]   # Objective 1 consensus ranks 1,2,3

  - cluster_id: 1
    label: "elevated/hill interior, Nilgiris-adjacent (41 pts, medoid elev 627 m)"
    n_points: 41
    population_covered: 20422160
    Tm_target_C: 67.0
    T_mains_est_C: 23.969
    L_required_kJ_per_kg: 438.22
    medoid_point_id: TNP_0007
    medoid_elevation_m: 626.92
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster1_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster1_daily.csv
    pcm_shortlist: ["RT57HC", "n-Hexacosane (C26)", "n-Pentacosane (C25)"]   # Objective 1 consensus ranks 1,2,3

  - cluster_id: 2
    label: "coastal metro lowland, largest population (46 pts, medoid elev 44 m)"
    n_points: 46
    population_covered: 30335760
    Tm_target_C: 67.0
    T_mains_est_C: 27.768
    L_required_kJ_per_kg: 405.54
    medoid_point_id: TNP_0001
    medoid_elevation_m: 44.30
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster2_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster2_daily.csv
    pcm_shortlist: ["RT57HC", "n-Pentacosane (C25)", "n-Hexacosane (C26)"]   # Objective 1 consensus rank 1, then a genuine tie at rank 2

pcm_database_file: data/objective1/pcm_database_tamilnadu.csv
pcm_mcdm_topk_file: data/objective1/mcdm_topk_by_cluster.csv
