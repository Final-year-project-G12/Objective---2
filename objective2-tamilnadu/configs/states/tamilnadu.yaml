# ============================================================================
# states/tamilnadu.yaml  —  Phase 1 output (per-state, version-locked)
# ============================================================================
# References (does NOT copy) the shared configs and Objective 1 frozen
# inputs already sitting under data/objective1/, data/weather/, data/demand/.
# Generated by hand from the frozen Objective 1 outputs
# (data/objective1/cluster_profiles_tamilnadu.csv, mcdm_topk_by_cluster.csv,
# manifest.json) — see docs_objective2/01_PHASE1_CONFIG_AND_STATE_SETUP.md
# for exactly how each field below was read off those files.
#
# Do not edit this file after Phase 4 (verification) begins. A later change
# to any field here means the state must re-run from Phase 2 onward
# (O2_Unified_PerState_Execution_Framework.md, Phase 0 gate).
# ============================================================================

state: tamilnadu
state_config_version: "state_config_tamilnadu_v1.0"
objective1_manifest: data/objective1/manifest.json

shared_config:
  system_config: configs/system_config_shared.yaml
  design_bounds: configs/design_bounds_shared.yaml
pareto_tolerance_pct: 5.0   # inherited from system_config_shared.yaml — do not override (Bug-Fix 7)

demand_profile:
  file: data/demand/demand_profile_tamilnadu.csv
  daily_total_L: 300.0
  documented_reason: >
    Matches 04b_climate_signature.py's DRAW_VOLUME_L=300 assumption
    (Avargani et al. 2021) so Objective 1's L_required figures and
    Objective 2's simulated solar fraction evaluate the same household.
    See build_demand_profile.py docstring.

mains_temperature_C:
  range_low: 22.0
  range_high: 30.0
  source: "O2_Unified_PerState_Execution_Framework.md, state input table (Tamil Nadu row)"
  # Per-regime point estimate used by the simulator is T_mains_est_C below
  # (read from cluster_profiles_tamilnadu.csv, already inside this range).

climate_signature_sanity_check:
  # Bug-Fix 8 — confirms this is genuinely Tamil Nadu weather, not another state's.
  annual_GHI_daily_kWh_expected_band: [4.0, 5.6]     # TN coastal/interior, framework doc §2
  humidity_signature_expected: "RH_mean > 60% in most clusters (coastal/humid)"
  elevation_note: "Tamil Nadu uses flat 150 m elevation approximation (no dedicated elevation script) — documented Obj1 limitation, not an Obj2 change."
  status: PASSED
  evidence: >
    cluster_profiles_tamilnadu.csv: GHI_daily_kWh in [5.13, 5.28] kWh/m2/day
    (inside expected band); RH_mean in [62.5, 70.2]% across the 5 clusters —
    consistent with Tamil Nadu's coastal-humid signature, not e.g.
    Rajasthan's hot-dry low-humidity signature.

# One entry per Level-A GMM regime discovered by Objective 1 (K_FINAL=5).
# Do not re-cluster. Values below are population-weighted cluster means from
# data/objective1/cluster_profiles_tamilnadu.csv.
regimes:
  - cluster_id: 0
    label: "coastal/high-humidity (small, 8 pts)"
    n_points: 8
    population_covered: 12658861
    Tm_target_C: 57.0
    T_mains_est_C: 25.997
    L_required_kJ_per_kg: 301.43
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster0_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster0_daily.csv
    pcm_shortlist: ["n-Octacosane (C28)", "n-Hexacosane (C26)", "PureTemp 58"]

  - cluster_id: 1
    label: "interior plains (largest, 42 pts)"
    n_points: 42
    population_covered: 19812760
    Tm_target_C: 57.0
    T_mains_est_C: 24.390
    L_required_kJ_per_kg: 321.61
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster1_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster1_daily.csv
    pcm_shortlist: ["n-Octacosane (C28)", "RT64HC", "n-Hexacosane (C26)"]

  - cluster_id: 2
    label: "coastal belt (39 pts)"
    n_points: 39
    population_covered: 18057220
    Tm_target_C: 57.0
    T_mains_est_C: 25.935
    L_required_kJ_per_kg: 302.20
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster2_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster2_daily.csv
    pcm_shortlist: ["n-Octacosane (C28)", "PureTemp 58", "n-Hexacosane (C26)"]

  - cluster_id: 3
    label: "semi-arid interior / Coimbatore-Tiruppur-like (22 pts)"
    n_points: 22
    population_covered: 10252760
    Tm_target_C: 57.0
    T_mains_est_C: 25.787
    L_required_kJ_per_kg: 304.07
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster3_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster3_daily.csv
    pcm_shortlist: ["n-Octacosane (C28)", "PureTemp 58", "n-Hexacosane (C26)"]

  - cluster_id: 4
    label: "high-humidity / highest HSI (22 pts)"
    n_points: 22
    population_covered: 10445170
    Tm_target_C: 57.0
    T_mains_est_C: 24.039
    L_required_kJ_per_kg: 326.02
    weather_hourly: data/weather/weather_regime_tamilnadu_cluster4_hourly.csv
    weather_daily: data/weather/weather_regime_tamilnadu_cluster4_daily.csv
    pcm_shortlist: ["n-Octacosane (C28)", "RT64HC", "n-Hexacosane (C26)"]

pcm_database_file: data/objective1/pcm_database_tamilnadu.csv
pcm_mcdm_topk_file: data/objective1/mcdm_topk_by_cluster.csv
